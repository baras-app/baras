[package]
name = "app-ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
baras-types = { path = "../types" }
dioxus = { version = "0.7.10", features = ["web"] }
dioxus-logger = "0.7.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Navigator", "Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "NodeList", "CssStyleDeclaration"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1"
gloo-timers = { version = "0.4", features = ["futures"] }
futures-util = { version = "0.3", default-features = false }

[lints]
workspace = true
