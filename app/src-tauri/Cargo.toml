[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lints]
workspace = true


[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on
# Windows, see https://github.com/rust-lang/cargo/issues/8519. Desktop only
# needs the default rlib; staticlib/cdylib are for mobile targets and each
# cost a full extra LTO link.
name = "app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
baras-core = { path = "../../core" }
baras-types = { path = "../../types" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
baras-overlay = { path = "../../overlay" }
tokio = { version = "1.48.0", features = ["sync", "net", "io-util"] }
png = "0.18"
chrono = "0.4.42"
toml = "1"
reqwest = { version = "0.13", features = ["multipart", "gzip"] }
flate2 = "1.1"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.23"
pulldown-cmark = "0.13"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rolling-file = { workspace = true }
# Recognition model is downloaded on first use, not bundled.
baras-raid-ocr = { path = "../../raid-ocr" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts", "open_uri"] }
futures-util = "0.3"
sha2 = "0.10"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tts = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

