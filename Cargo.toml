[workspace]
resolver = "2"
members = ["types", "core", "overlay", "app", "app/src-tauri", "validate", "parse-worker", "raid-ocr"]

# Judgement lints: these flag shapes that are deliberate here.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
upper_case_acronyms = "allow" # DPS, HPS, APM are the domain's own names

# Line tables keep backtraces readable; full debuginfo for ~900 dependencies
# mostly costs link time and disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"           # Link-time optimization across crates
codegen-units = 1      # Better optimization (slower compile)
panic = "abort"        # No unwinding overhead
strip = "symbols"      # Strip symbols from release binaries (smaller, no runtime cost)

# The Tauri backend is glue around core/overlay, and by far the largest crate:
# parallel codegen there shortens release builds, and thin LTO still inlines
# across it. The parser and renderer keep a single unit.
[profile.release.package.app]
codegen-units = 16

# dx builds the frontend with this profile. wasm-bindgen reads custom sections
# that `strip` removes under LLVM 23 (rustc 1.99+); wasm-opt shrinks the
# output afterwards, so stripping here buys nothing.
[profile.wasm-release]
inherits = "release"
strip = false

[workspace.dependencies]
# Pin swash to 0.2.6: version 0.2.8 has a hinting cache bug where LRU-evicted
# entries keep stale size/coords fields, causing glyphs to be hinted at the
# wrong font size and rendering at visually inconsistent sizes mid-fight.
swash = "=0.2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rolling-file = "0.2"
