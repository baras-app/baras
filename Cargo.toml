[workspace]
resolver = "2"
members = ["types", "core", "overlay", "app", "app/src-tauri", "validate", "parse-worker", "raid-ocr"]

[workspace.lints.clippy]
too_many_arguments = "allow"

# DataFusion 54's join cardinality estimator multiplies row-count estimates
# with unchecked usize math (joins/utils.rs:653); large encounters overflow and
# panic in debug builds. Fixed upstream (widened to u128) but unreleased —
# wrap like release does until we can upgrade past 54.x.
[profile.dev.package.datafusion-physical-plan]
overflow-checks = false

# Dependencies run hot paths (rten inference, tiny-skia/cosmic-text software
# rendering) that are 10-100x slower unoptimized: in a plain dev build raid OCR
# took 36s instead of ~0.4s, and overlay rendering starved input polling badly
# enough that clicks appeared dead during combat. Optimize dependencies only —
# workspace crates stay at opt-level 0 for fast rebuilds and real debugging.
[profile.dev.package."*"]
opt-level = 2

# The ML and rasterization crates specifically want full optimization.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3

[profile.release]
lto = "thin"           # Link-time optimization across crates
codegen-units = 1      # Better optimization (slower compile)
panic = "abort"        # No unwinding overhead
strip = "symbols"      # Strip symbols from release binaries (smaller, no runtime cost)

[workspace.dependencies]
# Pin swash to 0.2.6: version 0.2.8 has a hinting cache bug where LRU-evicted
# entries keep stale size/coords fields, causing glyphs to be hinted at the
# wrong font size and rendering at visually inconsistent sizes mid-fight.
swash = "=0.2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rolling-file = "0.2"
