# Powertech / Vanguard buffs (Imperial and Republic effect IDs in one entry).
# All new entries ship disabled; users opt in from the effect editor.

version = 1

# ─── Pyrotech / Plasmatech ─────────────────────────────────────────────────

# Every hit taken refills it to 10 s, capped at 30 s from application; no ICD (measured)
[[effect]]
id = "thermal_yield_buff"
name = "Thermal Yield / Durasteel Armor"
display_text = "{effect}"
enabled = false
trigger = { type = "effect_applied", effects = [4502478640906508, 4546987386994952], source = "local_player", target = "any" }
duration_secs = 10.0
is_affected_by_alacrity = false
color = [230, 180, 40, 255]
display_targets = ["effects_a"]
disciplines = ["Plasmatech", "Pyrotech"]
modifiers = [
  { refill_duration = true, max_duration_secs = 30.0, trigger = { type = "damage_taken" } },
]

# Each non-immune/resist Flaming Fist hit refreshes the 20 s duration, also at max stacks where the log shows nothing
[[effect]]
id = "heatstroke_buff"
name = "Heatstroke / Suppressive Heat"
display_text = "{effect}"
enabled = false
trigger = { type = "effect_applied", effects = [4499532293341445, 4546910077583621], source = "local_player", target = "any" }
refresh_scope = "source"
refresh_abilities = [
  { ability = 3384704812187648, trigger = "damage", ignore_immune_resist = true },
  { ability = 3391447910842368, trigger = "damage", ignore_immune_resist = true },
]
duration_secs = 20.0
is_affected_by_alacrity = false
show_single_stack = true
color = [230, 180, 40, 255]
display_targets = ["effects_a"]
disciplines = ["Plasmatech", "Pyrotech"]

