name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' app/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libpipewire-0.3-dev \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus and Tauri CLIs
        run: cargo binstall dioxus-cli@0.7.10 tauri-cli --no-confirm --force --locked

      - name: Setup linuxdeploy
        run: |
          mkdir -p ${{ runner.temp }}/tauri-tools/linuxdeploy
          wget -q -O ${{ runner.temp }}/tauri-tools/linuxdeploy/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          chmod +x ${{ runner.temp }}/tauri-tools/linuxdeploy/linuxdeploy-x86_64.AppImage

      - name: Build parse-worker sidecar
        run: |
          cargo build --release --package baras-parse-worker
          mkdir -p app/src-tauri/binaries
          cp target/release/baras-parse-worker app/src-tauri/binaries/baras-parse-worker-x86_64-unknown-linux-gnu

      - name: Read changelog
        id: changelog
        run: |
          # Read changelog, skip the version header line
          BODY=$(tail -n +3 CHANGELOG.md)
          # Handle multiline for GitHub Actions
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_TOOLKIT_PATH: ${{ runner.temp }}/tauri-tools
        with:
          projectPath: app
          tauriScript: cargo tauri
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "BARAS v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

      # Ubuntu's libpipewire hardcodes Debian's SPA plugin directory
      # (/usr/lib/x86_64-linux-gnu/spa-0.2); bundled into the AppImage it
      # cannot load its plugins on any non-Debian distro and portal screen
      # capture dies with "Creation failed". Strip it so the host's own
      # libpipewire (which knows its own plugin paths) is loaded instead,
      # then re-sign (the updater checks the .sig against the repacked
      # bytes) and replace the release assets.
      - name: Strip bundled libpipewire, repack, re-sign and re-upload AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          appdir=target/release/bundle/appimage/BARAS.AppDir
          appimage=$(ls target/release/bundle/appimage/*.AppImage)
          rm -f "$appdir"/usr/lib/libpipewire-0.3.so*
          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool "$appdir" "$appimage"
          cargo tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$appimage"
          gh release upload "v${{ steps.version.outputs.version }}" \
            "$appimage" "$appimage.sig" --clobber

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' app/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus and Tauri CLIs
        run: cargo binstall dioxus-cli@0.7.10 tauri-cli --no-confirm --force --locked

      - name: Build parse-worker sidecar
        run: |
          cargo build --release --package baras-parse-worker
          mkdir -p app/src-tauri/binaries
          cp target/release/baras-parse-worker.exe app/src-tauri/binaries/baras-parse-worker-x86_64-pc-windows-msvc.exe

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          # Read changelog, skip the version header line
          BODY=$(tail -n +3 CHANGELOG.md)
          # Handle multiline for GitHub Actions
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "BARAS v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

  build-macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' app/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus and Tauri CLIs
        run: cargo binstall dioxus-cli@0.7.10 tauri-cli --no-confirm --force --locked

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Add aarch64 target
        run: rustup target add aarch64-apple-darwin

      - name: Build parse-worker sidecar
        run: |
          cargo build --release --target aarch64-apple-darwin --package baras-parse-worker
          mkdir -p app/src-tauri/binaries
          cp target/aarch64-apple-darwin/release/baras-parse-worker app/src-tauri/binaries/baras-parse-worker-aarch64-apple-darwin

      - name: Read changelog
        id: changelog
        run: |
          # Read changelog, skip the version header line
          BODY=$(tail -n +3 CHANGELOG.md)
          # Handle multiline for GitHub Actions
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "BARAS v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

  update-manifest:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' app/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Wait for release assets to be available
          sleep 10

          # Read changelog for notes (first non-empty content line as summary)
           NOTES=$(sed -n '/^## /,/^## /p' CHANGELOG.md | head -1 | sed 's/^## //')

          # Download signatures
          LINUX_SIG=$(curl -sL "https://github.com/baras-app/baras/releases/download/v${VERSION}/BARAS_${VERSION}_amd64.AppImage.sig")
          WINDOWS_SIG=$(curl -sL "https://github.com/baras-app/baras/releases/download/v${VERSION}/BARAS_${VERSION}_x64-setup.exe.sig")
          MACOS_SIG=$(curl -sL "https://github.com/baras-app/baras/releases/download/v${VERSION}/BARAS_aarch64.app.tar.gz.sig")

          # Generate latest.json
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/baras-app/baras/releases/download/v${VERSION}/BARAS_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/baras-app/baras/releases/download/v${VERSION}/BARAS_${VERSION}_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/baras-app/baras/releases/download/v${VERSION}/BARAS_aarch64.app.tar.gz"
              }
            }
          }
          EOF

          cat latest.json

      - name: Commit latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for v${{ steps.version.outputs.version }}"
          git push
