name: Check

# Runs on master too so pull requests have a cache to restore from.
on:
  pull_request:
    paths: &paths
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "core/definitions/**"
      - "test-log-files/**"
      - "app/src-tauri/tauri.conf.json"
      - ".github/workflows/check.yml"
  push:
    branches: [master]
    paths: *paths

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # Every native crate. The tests cover the parser, signal pipeline and DSL,
  # including one that parses every bundled encounter and effect definition.
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # tauri-build refuses to run without the sidecar and frontend it
      # bundles; nothing here executes either.
      - name: Stub the sidecar and frontend bundle
        run: |
          mkdir -p app/src-tauri/binaries app/dist/public
          touch "app/src-tauri/binaries/baras-parse-worker-$(rustc -vV | sed -n 's/^host: //p')"

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude app-ui --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --exclude app-ui

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Clippy
        working-directory: app
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

  # Windows and macOS compile their own overlay, audio and tray backends,
  # which the Linux job never sees. Reported without failing the run until
  # both have had a first cleanup pass.
  platform:
    name: platform-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, exe: ".exe" }
          - { name: macos, os: macos-15, exe: "" }
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Stub the sidecar and frontend bundle
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries app/dist/public
          touch "app/src-tauri/binaries/baras-parse-worker-$(rustc -vV | sed -n 's/^host: //p')${{ matrix.exe }}"

      - name: Clippy
        run: cargo clippy --locked -p baras-overlay -p app --all-targets -- -D warnings
