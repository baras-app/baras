[package]
name = "baras-overlay"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []

[dependencies]
baras-core = { path = "../core" }
baras-types = { path = "../types" }

# Rendering (cross-platform)
tiny-skia = "0.12"
cosmic-text = "0.19"
fontdb = "0.23"      # Shared font database (re-export from cosmic-text)
ttf-parser = "0.25"  # Inspect font glyph coverage (filter to Latin-capable fonts)
swash = { workspace = true }  # Pinned to avoid 0.2.8 hinting cache bug
sys-locale = "0.3"   # System locale detection

# Async runtime
tokio = { version = "1.48", features = ["sync", "rt", "macros"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Icon loading
png = "0.17"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# SVG rendering (map overlay). resvg 0.47 renders onto a tiny-skia 0.12 Pixmap,
# matching the version used above so pixel buffers are directly interoperable.
resvg = "0.47"
usvg = "0.47"

# Platform: Wayland (Linux)
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
rustix = { version = "1.0", features = ["fs", "mm"] }

# Platform: X11 (Linux fallback)
x11rb = { version = "0.13", features = ["randr", "shape", "shm"] }

# Platform: Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_Devices_Display",
] }

# Platform: macOS
[target.'cfg(target_os = "macos")'.dependencies]
# Keep core-graphics for CGContext operations
core-graphics = "0.25"
# GCD for main thread dispatch
dispatch = "0.2"

# New objc2 ecosystem
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSDate",
  "NSGeometry",
  "NSObject",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSColor",
  "NSEvent",
  "NSGraphicsContext",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
